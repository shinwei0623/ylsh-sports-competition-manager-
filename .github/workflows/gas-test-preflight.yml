name: Prepare GAS TEST deployment
on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Type VERIFY_TEST_TARGET to run preflight'
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit TEST gate
        env:
          CONFIRM: ${{ inputs.confirm_target }}
        run: |
          test "$CONFIRM" = VERIFY_TEST_TARGET
      - name: Validate Apps Script manifest and expected source
        run: |
          python3 - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('appsscript.json').read_text(encoding='utf-8'))
          assert m['runtimeVersion']=='V8'
          assert m['webapp']['access']=='DOMAIN'
          for name in ('Code.gs','DemoData.gs','AdminApi.gs','Index.html'):
              assert pathlib.Path(name).is_file(),name
          assert 'test-demo-0.3' in pathlib.Path('Index.html').read_text(encoding='utf-8')
          print('Preflight PASS. No GAS files were uploaded.')
          PY
      - name: Deployment status
        run: |
          echo 'GAS deployment is intentionally blocked pending Google API authorization and non-destructive target verification.'
          echo 'Do not configure an automated push to an existing script before backing up its current files.'
