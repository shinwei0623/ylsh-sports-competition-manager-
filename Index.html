<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#17324d;background:#eef3fa}*{box-sizing:border-box}body{margin:0}header{background:#004b97;color:white;padding:20px}header h1{margin:0;font-size:23px}header small{opacity:.8}main{max-width:780px;margin:20px auto;padding:0 14px}section{background:white;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 3px 20px #102c4712}h2{margin:0 0 12px;font-size:19px}button{border:0;border-radius:10px;padding:14px 18px;font-size:16px;cursor:pointer;background:#004b97;color:white;min-height:48px}button:disabled{opacity:.5;cursor:not-allowed}.danger{background:#b42318}.secondary{background:#e8eff7;color:#17324d}.actions{display:flex;flex-wrap:wrap;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.stat{background:#f0f5fa;padding:16px;border-radius:12px}.stat strong{display:block;font-size:30px}#message{white-space:pre-wrap;line-height:1.6}input{padding:12px;width:100%;border:1px solid #bbc8d5;border-radius:8px;margin:8px 0 12px;font-size:16px}.muted{color:#52677d;font-size:14px}@media(max-width:480px){.actions button{width:100%}}
</style></head><body><header><small>BUILD test-demo-0.3 · TEST ONLY</small><h1>體育競賽管理系統</h1></header><main><section><h2>測試資料管理</h2><p class="muted">僅處理明確標記為 DEMO 的資料。未授權或未完成 TEST 設定時不允許執行。</p><div class="stats"><div class="stat">模擬競賽<strong id="events">—</strong></div><div class="stat">模擬報名<strong id="regs">—</strong></div></div><div class="actions"><button id="refresh" onclick="load()">重新整理</button><button id="seed" disabled onclick="seed()">產生 5 場競賽與 30 筆報名</button><button id="clear" class="danger" disabled onclick="confirmClear()">清除模擬資料</button></div><p id="message" role="status">正在檢查管理員權限…</p></section><section><h2>系統狀態</h2><p>競賽報名、檢錄與列印功能仍在開發中；此版本僅驗證測試資料管理。</p></section></main><script>
const $=id=>document.getElementById(id);let busy=false,ready=false;
function status(t){$('message').textContent=t}
function enable(){ $('refresh').disabled=busy;$('seed').disabled=busy||!ready;$('clear').disabled=busy||!ready;}
function requestId(){return 'ui-'+Date.now()+'-'+Math.random().toString(36).slice(2,12)}
function fail(e){busy=false;ready=false;enable();status('操作失敗：'+(e&&e.message||String(e)))}
function load(){busy=true;enable();status('正在載入…');google.script.run.withSuccessHandler(r=>{busy=false;ready=!!r.ready;$('events').textContent=r.counts.Events;$('regs').textContent=r.counts.Registrations;enable();status('TEST 資料已更新')}).withFailureHandler(fail).getDemoDataPreview()}
function seed(){if(!confirm('確定產生 5 場模擬競賽及 30 筆模擬報名？'))return;busy=true;enable();status('正在建立模擬資料…');google.script.run.withSuccessHandler(r=>{status('建立完成：'+r.batchId);busy=false;load()}).withFailureHandler(fail).createDemoData(requestId())}
function confirmClear(){if(!confirm('只會清除 DEMO 標記資料。是否繼續？'))return;const value=prompt('請輸入 CLEAR DEMO 以確認清除');if(value!=='CLEAR DEMO'){status('已取消');return}busy=true;enable();status('正在備份並清除…');google.script.run.withSuccessHandler(r=>{busy=false;load();status('清除完成：'+JSON.stringify(r.deleted)+'。備份網址：'+r.backupUrl)}).withFailureHandler(fail).clearDemoData(value,requestId())}
load();
</script></body></html>
