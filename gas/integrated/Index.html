<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#004b97"><style>
:root{--b:#004b97;--ink:#17324d;--muted:#64748b;--bg:#edf3f9;--line:#d6e0eb;--ok:#137333;--bad:#b42318;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;padding-bottom:88px}button,input,select{font:inherit;font-size:16px}header{background:linear-gradient(135deg,var(--b),#082d55);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 24px}.head,main{max-width:1050px;margin:auto}.head{display:flex;justify-content:space-between;gap:15px}.head h1{margin:4px 0;font-size:clamp(25px,6vw,38px)}.head p{margin:4px 0;opacity:.9}.build{font-size:12px;border:1px solid #ffffff66;padding:6px 9px;border-radius:99px;height:max-content;white-space:nowrap}main{padding:16px}.view{display:none}.view.on{display:block}.card,.event{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px #12395c12}.hero{background:linear-gradient(140deg,#fff,#e9f4ff);border-left:5px solid var(--b)}h2,h3{margin-top:0}.grid,.events{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.events .event{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eef5fc;border-radius:14px;padding:14px}.stat strong{display:block;font-size:28px;color:var(--b)}.pill{display:inline-block;padding:5px 9px;margin:3px;border-radius:99px;background:#eaf2fa;font-size:13px}.open{background:#e6f4ea;color:var(--ok)}.muted{color:var(--muted);font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.btn{border:0;border-radius:12px;background:var(--b);color:#fff;padding:12px 16px;min-height:48px;font-weight:800}.btn.secondary{background:#e6eef7;color:var(--ink)}.btn.bad{background:var(--bad)}label{display:block;font-weight:750;margin:11px 0 5px}.input,select{width:100%;border:1px solid #b7c6d6;border-radius:12px;padding:12px;min-height:48px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.member{background:#f5f8fc;border:1px solid #e0e8f0;padding:13px;border-radius:14px;margin:9px 0}.status,.empty{padding:13px;border-radius:12px;background:#eef5fc;margin:10px 0}.status.ok{background:#e6f4ea;color:var(--ok)}.status.error{background:#fdecec;color:var(--bad)}.empty{text-align:center;color:var(--muted);border:1px dashed #b8c7d6}.table{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e3ebf2}th{background:#eff5fb}.qr{width:170px;max-width:100%;background:#fff;border:8px solid #fff}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #17324d18}.nav button{border:0;background:transparent;color:#52677b;padding:8px 13px;border-radius:12px}.nav button.on{background:#e6f1ff;color:var(--b);font-weight:800}.loading{position:fixed;z-index:99;inset:0;background:#092c4caa;color:#fff;display:flex;align-items:center;justify-content:center}.hidden{display:none!important}@media(max-width:700px){.grid,.events,.row{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat strong{font-size:23px}.head{display:block}.build{display:inline-block;margin-top:8px}.nav{justify-content:flex-start;overflow:auto}.nav button{min-width:74px}.card{padding:15px}}
</style></head><body>
<header><div class="head"><div><p id="school">國立宜蘭高級中學</p><h1>體育競賽報名專區</h1><p id="who">正在確認登入身分…</p></div><span class="build">INTEGRATED 2.0.1 TEST</span></div></header><main>
<section id="home" class="view on"><div class="card hero"><h2>一個入口，完成報名與查詢</h2><p>查看開放項目、送出個人或團體報名，並隨時查詢自己的報名、抽籤、賽程與成績。</p><div class="actions"><button class="btn" onclick="go('events')">查看競賽</button><button class="btn secondary" onclick="go('mine')">我的報名</button></div></div><div class="card"><div class="stats"><div class="stat">全部競賽<strong id="nEvent">—</strong></div><div class="stat">開放報名<strong id="nOpen">—</strong></div><div class="stat">我的報名<strong id="nMine">—</strong></div></div></div><div class="card"><h2>近期競賽</h2><div id="homeEvents" class="events"></div></div></section>
<section id="events" class="view"><div class="card"><h2>競賽列表</h2><p class="muted">只有「開放報名」的項目可以送出報名。</p><div id="eventList" class="events"></div></div></section>
<section id="register" class="view"><div class="card"><h2 id="regTitle">競賽報名</h2><form onsubmit="submitReg(event)"><input type="hidden" id="eventId"><div class="row"><div><label>班級</label><input id="className" class="input" placeholder="例如：一年一班" required></div><div><label>隊名（個人賽可留白）</label><input id="teamName" class="input"></div></div><div class="row"><div><label>聯絡電話（選填）</label><input id="phone" class="input" inputmode="tel"></div><div><label>參賽組別</label><select id="category"></select></div></div><h3>參賽成員</h3><div id="members"></div><div class="actions"><button type="button" class="btn secondary" onclick="addMember()">＋新增成員</button><button class="btn" type="submit">確認送出報名</button></div><div id="regMsg"></div></form></div></section>
<section id="mine" class="view"><div class="card"><h2>我的報名</h2><div id="myList"></div></div></section>
<section id="results" class="view"><div class="card"><h2>抽籤、賽程與成績</h2><label>選擇競賽</label><select id="resultEvent" onchange="loadCompetition()"></select><div id="competition" style="margin-top:14px"></div></div></section>
</main><nav class="nav"><button data-v="home" class="on" onclick="go('home')">首頁</button><button data-v="events" onclick="go('events')">競賽</button><button data-v="mine" onclick="go('mine')">我的報名</button><button data-v="results" onclick="go('results')">賽程成績</button></nav><a id="adminLink" class="hidden" style="display:block;text-align:center;margin:12px" href="#">管理中心</a><div id="loading" class="loading">正在連接競賽資料庫…</div>
<script>
function jsid(v){return esc(String(v??'').replace(/[^A-Za-z0-9_-]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')));}
const S={boot:null,current:null,requestId:null,submitting:false},$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function call(n,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(r=>r&&r.ok?ok(r.data):no(new Error(r?.error?.message||'操作失敗'))).withFailureHandler(e=>no(new Error(e?.message||e)))[n](...a))}function busy(v,t){$('loading').classList.toggle('hidden',!v);if(t)$('loading').textContent=t}function msg(id,t,c=''){$(id).className='status '+c;$(id).textContent=t}function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===id));scrollTo(0,0);if(id==='results'&&!$('resultEvent').value&&S.boot.events[0]){$('resultEvent').value=S.boot.events[0].eventId;loadCompetition()}}
const fmt=v=>{if(!v)return '未設定';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'})},ename=id=>S.boot.events.find(e=>e.eventId===id)?.name||id,rlabel=r=>r.teamName||[r.className,r.seatNo,r.studentName].filter(Boolean).join(' ')||r.registrationId;
function card(e){const open=e.status==='OPEN';return '<article class="event"><h3>'+esc(e.name)+'</h3><span class="pill '+(open?'open':'')+'">'+(open?'開放報名':esc(e.status))+'</span><span class="pill">'+esc(e.eventType||e.category||'競賽')+'</span><p class="muted">日期：'+fmt(e.eventDate)+'<br>場地：'+esc(e.venue||'未定')+'<br>截止：'+fmt(e.registrationCloseAt)+'</p><div class="actions">'+(open?'<button class="btn" onclick="openReg(\''+jsid(e.eventId)+'\')">我要報名</button>':'')+'<button class="btn secondary" onclick="openResult(\''+jsid(e.eventId)+'\')">賽程成績</button></div></article>'}
async function boot(){busy(true);try{S.boot=await call('apiBootstrap');$('school').textContent=S.boot.settings.schoolName||'國立宜蘭高級中學';$('who').textContent=S.boot.actor.email||'請先登入 Google 帳號';$('nEvent').textContent=S.boot.counts.events;$('nOpen').textContent=S.boot.counts.openEvents;$('nMine').textContent=S.boot.registrations.length;const h=S.boot.events.map(card).join('')||'<div class="empty">目前沒有競賽</div>';$('eventList').innerHTML=h;$('homeEvents').innerHTML=S.boot.events.slice(0,4).map(card).join('')||'<div class="empty">尚無競賽</div>';$('resultEvent').innerHTML='<option value="">請選擇</option>'+S.boot.events.map(e=>'<option value="'+jsid(e.eventId)+'">'+esc(e.name)+'</option>').join('');renderMine();$('adminLink').href=S.boot.navigation.admin;$('adminLink').classList.toggle('hidden',!S.boot.actor.roles.length)}catch(e){alert('載入失敗：'+e.message)}finally{busy(false)}}
function openReg(id){const e=S.boot.events.find(x=>x.eventId===id);if(!e)return;S.current=e;S.requestId='web-'+Date.now()+'-'+Math.random().toString(36).slice(2);$('eventId').value=id;$('regTitle').textContent='報名｜'+e.name;$('category').innerHTML='<option value="">一般組</option>'+S.boot.categories.filter(c=>c.eventId===id&&c.status!=='CLOSED').map(c=>'<option value="'+esc(c.categoryId)+'">'+esc(c.name)+'</option>').join('');$('members').innerHTML='';for(let i=0;i<Math.max(1,Number(e.teamMin||1));i++)addMember();go('register')}
function addMember(){const n=document.querySelectorAll('.member').length+1,d=document.createElement('div');d.className='member';d.innerHTML='<strong>成員 '+n+'</strong><div class="row"><div><label>姓名</label><input class="input mn" required></div><div><label>學號（必填）</label><input class="input mi" required></div></div><div class="row"><div><label>班級</label><input class="input mc" value="'+esc($('className').value)+'"></div><div><label>座號</label><input class="input ms" inputmode="numeric"></div></div>'+(n>1?'<button type="button" class="btn secondary" onclick="this.parentElement.remove()">移除</button>':'');$('members').appendChild(d)}
async function submitReg(ev){ev.preventDefault();if(S.submitting)return;S.submitting=true;const members=[...document.querySelectorAll('.member')].map(m=>({studentName:m.querySelector('.mn').value,studentId:m.querySelector('.mi').value,className:m.querySelector('.mc').value||$('className').value,seatNo:m.querySelector('.ms').value}));busy(true,'正在送出報名…');try{const r=await call('apiSubmitRegistration',{eventId:$('eventId').value,categoryId:$('category').value,className:$('className').value,teamName:$('teamName').value,contactPhone:$('phone').value,members,requestId:S.requestId});msg('regMsg','報名成功：'+r.registrationId,'ok');await boot();go('mine')}catch(e){msg('regMsg',e.message,'error')}finally{S.submitting=false;busy(false)}}
function renderMine(){const a=S.boot.registrations;$('myList').innerHTML=a.length?a.map(r=>'<div class="event"><h3>'+esc(ename(r.eventId))+'</h3><p>'+esc(rlabel(r))+'</p><span class="pill">'+esc(r.status)+'</span><span class="pill">'+jsid(r.registrationId)+'</span><p class="muted">檢錄時請出示上方報名編號。</p><div class="actions">'+(!['CANCELLED','REJECTED','CHECKED_IN'].includes(r.status)?'<button class="btn bad" onclick="cancelReg(\''+jsid(r.registrationId)+'\')">取消報名</button>':'')+'</div></div>').join(''):'<div class="empty">目前沒有報名紀錄</div>'}async function cancelReg(id){if(!confirm('確定取消這筆報名？'))return;busy(true);try{await call('apiCancelRegistration',id);await boot();go('mine')}catch(e){alert(e.message)}finally{busy(false)}}
function openResult(id){$('resultEvent').value=id;go('results');loadCompetition()}async function loadCompetition(){const id=$('resultEvent').value;if(!id){$('competition').innerHTML='<div class="empty">請選擇競賽</div>';return}try{const c=await call('apiListCompetition',id),by=Object.fromEntries(c.registrations.map(r=>[r.registrationId,r]));let h='<h3>賽程</h3>'+(!c.matches.length?'<div class="empty">尚未公布賽程</div>':'<div class="table"><table><tr><th>輪次</th><th>時間</th><th>場地</th><th>對戰</th></tr>'+c.matches.map(m=>'<tr><td>'+esc(m.roundName)+' '+esc(m.matchNo)+'</td><td>'+fmt(m.scheduledAt)+'</td><td>'+esc(m.venue)+'</td><td>'+esc(rlabel(by[m.sideARegistrationId]||{}))+' vs '+esc(rlabel(by[m.sideBRegistrationId]||{}))+'</td></tr>').join('')+'</table></div>');h+='<h3 style="margin-top:20px">抽籤／分組</h3>'+(!c.draws.length?'<div class="empty">尚未抽籤</div>':'<div class="table"><table><tr><th>組別</th><th>道次</th><th>籤號</th><th>參賽者</th></tr>'+c.draws.map(d=>'<tr><td>'+esc(d.groupNo)+'</td><td>'+esc(d.laneNo)+'</td><td>'+esc(d.seedNo)+'</td><td>'+esc(rlabel(by[d.registrationId]||{}))+'</td></tr>').join('')+'</table></div>');h+='<h3 style="margin-top:20px">成績</h3>'+(!c.results.length?'<div class="empty">尚未公布成績</div>':'<div class="table"><table><tr><th>名次</th><th>參賽者</th><th>成績</th><th>狀態</th></tr>'+c.results.sort((a,b)=>Number(a.rank)-Number(b.rank)).map(r=>'<tr><td>'+esc(r.rank||'—')+'</td><td>'+esc(rlabel(by[r.registrationId]||{}))+'</td><td>'+esc(r.score)+' '+esc(r.unit)+'</td><td>'+esc(r.resultStatus)+'</td></tr>').join('')+'</table></div>');$('competition').innerHTML=h}catch(e){$('competition').innerHTML='<div class="status error">'+esc(e.message)+'</div>'}}
boot();
</script></body></html>
