<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#083967"><style>
:root{--nav:#082f55;--blue:#0057a8;--gold:#e5a823;--ink:#19324a;--muted:#68798a;--bg:#eef2f6;--card:#fff;--line:#d9e1e9;--ok:#137333;--bad:#b42318;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select,textarea{font:inherit;font-size:15px}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--nav),#061f37);color:#fff;padding:24px 14px;overflow:auto}.logo{padding:0 10px 22px;border-bottom:1px solid #ffffff22}.logo b{display:block;font-size:19px}.logo span{color:#bcd5ea;font-size:12px}.menu{display:grid;gap:5px;margin-top:18px}.menu button{border:0;background:transparent;color:#c9d9e7;text-align:left;border-radius:10px;padding:12px 13px}.menu button.on,.menu button:hover{background:#ffffff17;color:#fff;border-left:3px solid var(--gold)}.account{margin-top:22px;padding:12px;background:#ffffff0e;border-radius:12px;font-size:12px;word-break:break-all}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}.top h1{font-size:21px;margin:0}.top small{color:var(--muted)}.content{padding:22px;max-width:1450px;margin:auto}.page{display:none}.page.on{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.metric,.card{background:var(--card);border:1px solid #fff;border-radius:15px;box-shadow:0 5px 22px #19334b0c}.metric{padding:17px;border-top:4px solid var(--blue)}.metric:nth-child(2){border-color:var(--gold)}.metric:nth-child(3){border-color:var(--ok)}.metric:nth-child(4){border-color:#7a4eb3}.metric strong{display:block;font-size:29px;margin-top:6px}.metric span{color:var(--muted)}.card{padding:18px;margin-bottom:15px}h2,h3{margin:0 0 13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-weight:750;margin:10px 0 5px}.input,select,textarea{width:100%;border:1px solid #b9c7d4;border-radius:10px;padding:10px 12px;min-height:44px;background:#fff}textarea{min-height:82px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.btn{border:0;border-radius:10px;padding:10px 14px;min-height:42px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#e7eef5;color:var(--ink)}.btn.good{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gold{background:#bb7c00}.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-bottom:12px}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e6ecf1;vertical-align:top}th{background:#edf3f8;position:sticky;top:0}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8eff6;font-size:12px}.pill.ok{background:#e6f4ea;color:var(--ok)}.pill.bad{background:#fdecec;color:var(--bad)}.hint,.empty{color:var(--muted);font-size:13px}.empty{padding:28px;text-align:center;border:1px dashed #becbd7;border-radius:12px}.status{padding:11px;margin:10px 0;border-radius:10px;background:#eaf2fa}.status.ok{background:#e6f4ea;color:var(--ok)}.status.err{background:#fdecec;color:var(--bad)}.loading,.denied{position:fixed;z-index:99;inset:0;background:#062b4be8;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}.hidden{display:none!important}.mobilebar{display:none}.audit{font:12px ui-monospace,monospace}.print-only{display:none}
@media(max-width:900px){.shell{display:block}.side{display:none}.top{height:auto;min-height:66px;padding:12px 16px}.content{padding:13px 12px 90px}.cards{grid-template-columns:1fr 1fr}.grid2,.row,.filters{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow:auto}.mobilebar button{border:0;background:transparent;min-width:73px;padding:8px 7px;font-size:12px;color:#5b6e80}.mobilebar button.on{background:#e7f0fa;color:var(--blue);font-weight:bold;border-radius:10px}.top h1{font-size:18px}}
@media print{.side,.top,.mobilebar,.no-print{display:none!important}.shell{display:block}.content{padding:0}.page{display:none!important}.print-only{display:block!important}.card{box-shadow:none;border:0}table{min-width:0;font-size:11px}th,td{padding:5px}}
</style></head><body><div class="shell"><aside class="side"><div class="logo"><b>YLSH SPORTS</b><span>體育競賽整合管理系統</span></div><nav class="menu">
<button data-p="dashboard" class="on" onclick="show('dashboard')">總覽儀表板</button><button data-p="events" onclick="show('events')">競賽管理</button><button data-p="registrations" onclick="show('registrations')">報名審核</button><button data-p="checkin" onclick="show('checkin')">現場檢錄</button><button data-p="draw" onclick="show('draw')">抽籤與賽程</button><button data-p="results" onclick="show('results')">成績管理</button><button data-p="print" onclick="show('print')">列印中心</button><button data-p="settings" onclick="show('settings')">設定與權限</button></nav><div class="account" id="account">正在驗證管理權限…</div></aside>
<div class="main"><header class="top"><div><h1 id="pageTitle">管理總覽</h1><small id="subtitle">同一套資料、兩種角色入口</small></div><b style="color:var(--blue)">INTEGRATED 2.0</b></header><main class="content">
<section id="dashboard" class="page on"><div class="cards"><div class="metric"><span>競賽項目</span><strong id="mEvents">—</strong></div><div class="metric"><span>待審核報名</span><strong id="mPending">—</strong></div><div class="metric"><span>核准報名</span><strong id="mApproved">—</strong></div><div class="metric"><span>已完成檢錄</span><strong id="mChecked">—</strong></div></div><div class="grid2"><div class="card"><h2>快速操作</h2><div class="actions"><button class="btn" onclick="show('events');newEvent()">＋建立競賽</button><button class="btn gold" onclick="show('registrations')">審核報名</button><button class="btn good" onclick="show('checkin')">開始檢錄</button></div></div><div class="card"><h2>系統狀態</h2><div class="status ok">資料庫已連線 · 報名端與管理端共用資料</div><p class="hint" id="lastRefresh"></p></div></div><div class="card"><h2>近期競賽</h2><div id="dashEvents"></div></div></section>
<section id="events" class="page"><div class="grid2"><div class="card"><h2>競賽清單</h2><div id="eventList"></div></div><div class="card"><h2 id="eventFormTitle">新增競賽</h2><input type="hidden" id="evId"><div class="row"><div><label>名稱</label><input id="evName" class="input"></div><div><label>狀態</label><select id="evStatus"><option value="DRAFT">草稿</option><option value="OPEN">開放報名</option><option value="CLOSED">截止</option><option value="ONGOING">進行中</option><option value="FINISHED">完成</option></select></div></div><div class="row"><div><label>類型</label><select id="evType"><option value="INDIVIDUAL">個人</option><option value="TEAM">團體</option><option value="RELAY">接力</option><option value="BALL">球類</option><option value="FUN">趣味</option></select></div><div><label>場地</label><input id="evVenue" class="input"></div></div><div class="row"><div><label>比賽日期</label><input id="evDate" type="datetime-local" class="input"></div><div><label>報名截止</label><input id="evClose" type="datetime-local" class="input"></div></div><div class="row"><div><label>最少人數</label><input id="evMin" type="number" min="1" value="1" class="input"></div><div><label>最多人數</label><input id="evMax" type="number" min="1" value="1" class="input"></div></div><label>規則／備註</label><textarea id="evNotes"></textarea><div class="actions"><button class="btn" onclick="saveEvent()">儲存競賽</button><button class="btn secondary" onclick="newEvent()">清除</button></div><div id="evMsg"></div></div></div></section>
<section id="registrations" class="page"><div class="card"><h2>報名審核與查詢</h2><div class="filters"><input id="regSearch" class="input" placeholder="搜尋姓名、班級、隊名或編號" oninput="renderRegs()"><select id="regEventFilter" onchange="renderRegs()"></select><select id="regStatusFilter" onchange="renderRegs()"><option value="">全部狀態</option><option value="REGISTERED">待審核</option><option value="APPROVED">已核准</option><option value="REJECTED">退回</option><option value="CHECKED_IN">已檢錄</option><option value="CANCELLED">已取消</option></select></div><div id="regTable"></div></div></section>
<section id="checkin" class="page"><div class="grid2"><div class="card"><h2>快速檢錄</h2><label>報名編號</label><input id="checkId" class="input" placeholder="REG-…"><div class="actions"><button class="btn good" onclick="checkIn('MANUAL')">確認到場</button><button class="btn secondary" onclick="startScanner()">開啟 QR 掃描</button></div><video id="scanner" class="hidden" playsinline style="width:100%;margin-top:12px;border-radius:12px"></video><div id="checkMsg"></div></div><div class="card"><h2>今日／全部檢錄紀錄</h2><div id="checkList"></div></div></div></section>
<section id="draw" class="page"><div class="grid2"><div class="card"><h2>自動抽籤分組</h2><label>競賽</label><select id="drawEvent"></select><label>每組人數／跑道數</label><input id="groupSize" class="input" type="number" min="2" value="8"><div class="actions"><button class="btn" onclick="generateDraw()">產生結果</button></div><div id="drawMsg"></div></div><div class="card"><h2>建立賽程</h2><label>競賽</label><select id="matchEvent" onchange="fillMatchRegs()"></select><div class="row"><div><label>輪次</label><input id="roundName" class="input" placeholder="預賽／決賽"></div><div><label>場次</label><input id="matchNo" class="input" placeholder="1"></div></div><div class="row"><div><label>時間</label><input id="matchAt" type="datetime-local" class="input"></div><div><label>場地</label><input id="matchVenue" class="input"></div></div><div class="row"><div><label>A 方</label><select id="sideA"></select></div><div><label>B 方</label><select id="sideB"></select></div></div><button class="btn" style="margin-top:12px" onclick="saveMatch()">儲存賽程</button><div id="matchMsg"></div></div></div><div class="card"><h2>抽籤與賽程資料</h2><div id="drawData"></div></div></section>
<section id="results" class="page"><div class="grid2"><div class="card"><h2>登錄成績</h2><label>競賽</label><select id="resultEvent" onchange="fillResultRegs()"></select><label>參賽者／隊伍</label><select id="resultReg"></select><div class="row"><div><label>名次</label><input id="rank" type="number" min="0" class="input"></div><div><label>成績</label><input id="score" class="input"></div></div><div class="row"><div><label>單位</label><input id="unit" class="input" placeholder="秒、分、公尺"></div><div><label>狀態</label><select id="resultStatus"><option value="OFFICIAL">正式</option><option value="PROVISIONAL">暫定</option><option value="DQ">失格</option></select></div></div><button class="btn" style="margin-top:12px" onclick="saveResult()">儲存成績</button><div id="resultMsg"></div></div><div class="card"><h2>成績清單</h2><div id="resultList"></div></div></div></section>
<section id="print" class="page"><div class="card"><h2>列印中心</h2><p>依目前真實資料產生 A4 文件。</p><div class="actions"><button class="btn" onclick="printDoc('checkin')">檢錄表</button><button class="btn secondary" onclick="printDoc('draw')">抽籤表</button><button class="btn secondary" onclick="printDoc('schedule')">賽程表</button><button class="btn secondary" onclick="printDoc('bib')">號碼布清單</button></div></div></section>
<section id="settings" class="page"><div class="grid2"><div class="card"><h2>系統設定</h2><label>學校／系統名稱</label><input id="schoolName" class="input"><label>主題色</label><input id="themeColor" class="input" type="color"><button class="btn" style="margin-top:12px" onclick="saveSettings()">儲存設定</button><div id="settingsMsg"></div></div><div class="card"><h2>新增角色權限</h2><label>Google 帳號</label><input id="roleEmail" class="input" type="email"><div class="row"><div><label>角色</label><select id="roleName"><option value="EVENT_ADMIN">活動管理員</option><option value="CHECKIN">檢錄員</option><option value="CLASS_ADMIN">班級管理員</option></select></div><div><label>範圍 ID</label><input id="scopeId" class="input" value="*"></div></div><button class="btn" style="margin-top:12px" onclick="saveRole()">儲存權限</button><div id="roleMsg"></div></div></div><div class="card"><h2>目前權限</h2><div id="roleList"></div></div><div class="card"><h2>最近操作紀錄</h2><div id="auditList"></div></div></section>
<section id="printArea" class="print-only"></section></main></div></div>
<nav class="mobilebar"><button data-p="dashboard" class="on" onclick="show('dashboard')">總覽</button><button data-p="events" onclick="show('events')">競賽</button><button data-p="registrations" onclick="show('registrations')">審核</button><button data-p="checkin" onclick="show('checkin')">檢錄</button><button data-p="draw" onclick="show('draw')">賽程</button><button data-p="results" onclick="show('results')">成績</button><button data-p="settings" onclick="show('settings')">設定</button></nav><div id="loading" class="loading">正在載入管理資料…</div><div id="denied" class="denied hidden"><div><h1>無法進入管理中心</h1><p id="deniedText">此帳號沒有管理權限。</p></div></div>
<script>
const S={m:null},$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function call(n,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(r=>r&&r.ok?ok(r.data):no(new Error(r?.error?.message||'操作失敗'))).withFailureHandler(e=>no(new Error(e?.message||e)))[n](...a))}function busy(v,t){$('loading').classList.toggle('hidden',!v);if(t)$('loading').textContent=t}function msg(id,t,c=''){$(id).className='status '+c;$(id).textContent=t}const fmt=v=>{if(!v)return '—';let d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString('zh-TW',{hour12:false})},ename=id=>S.m.events.find(e=>e.eventId===id)?.name||id,rlabel=r=>r.teamName||[r.className,r.seatNo,r.studentName].filter(Boolean).join(' ')||r.registrationId;
const titles={dashboard:'管理總覽',events:'競賽管理',registrations:'報名審核',checkin:'現場檢錄',draw:'抽籤與賽程',results:'成績管理',print:'列印中心',settings:'設定與權限'};function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===id));$('pageTitle').textContent=titles[id];scrollTo(0,0);if(id==='draw')renderDraws();if(id==='results')renderResults()}
async function reload(){busy(true);try{S.m=await call('apiAdminModel');renderAll()}catch(e){$('deniedText').textContent=e.message;$('denied').classList.remove('hidden')}finally{busy(false)}}function eventOpts(){return '<option value="">請選擇</option>'+S.m.events.map(e=>'<option value="'+esc(e.eventId)+'">'+esc(e.name)+'</option>').join('')}function renderAll(){$('account').innerHTML='<b>'+esc(S.m.actor.email)+'</b><br>'+S.m.actor.roles.map(r=>esc(r.role)).join('、');$('subtitle').textContent=(S.m.settings.schoolName||'宜蘭高中')+' · 共用正式資料庫';$('mEvents').textContent=S.m.events.length;$('mPending').textContent=S.m.registrations.filter(r=>r.status==='REGISTERED').length;$('mApproved').textContent=S.m.registrations.filter(r=>r.status==='APPROVED').length;$('mChecked').textContent=S.m.checkIns.filter(c=>c.status==='PRESENT').length;$('lastRefresh').textContent='更新時間：'+new Date().toLocaleString('zh-TW');$('dashEvents').innerHTML=tableEvents(S.m.events.slice(0,6));$('eventList').innerHTML=tableEvents(S.m.events);['regEventFilter','drawEvent','matchEvent','resultEvent'].forEach(id=>$(id).innerHTML=(id==='regEventFilter'?'<option value="">全部競賽</option>':eventOpts()));$('schoolName').value=S.m.settings.schoolName||'';$('themeColor').value=S.m.settings.themeColor||'#0057a8';renderRegs();renderChecks();renderRoles();renderAudit();fillMatchRegs();fillResultRegs();renderDraws();renderResults()}
function tableEvents(a){return a.length?'<div class="table"><table><tr><th>名稱</th><th>日期</th><th>場地</th><th>狀態</th><th>操作</th></tr>'+a.map(e=>'<tr><td><b>'+esc(e.name)+'</b></td><td>'+fmt(e.eventDate)+'</td><td>'+esc(e.venue||'—')+'</td><td><span class="pill '+(e.status==='OPEN'?'ok':'')+'">'+esc(e.status)+'</span></td><td><button class="btn secondary" onclick="editEvent(\''+esc(e.eventId)+'\')">編輯</button></td></tr>').join('')+'</table></div>':'<div class="empty">尚無競賽</div>'}function newEvent(){['evId','evName','evVenue','evDate','evClose','evNotes'].forEach(id=>$(id).value='');$('evStatus').value='DRAFT';$('evType').value='INDIVIDUAL';$('evMin').value=1;$('evMax').value=1;$('eventFormTitle').textContent='新增競賽'}function editEvent(id){const e=S.m.events.find(x=>x.eventId===id);$('evId').value=e.eventId;$('evName').value=e.name;$('evStatus').value=e.status;$('evType').value=e.eventType;$('evVenue').value=e.venue||'';$('evDate').value=(e.eventDate||'').slice(0,16);$('evClose').value=(e.registrationCloseAt||'').slice(0,16);$('evMin').value=e.teamMin||1;$('evMax').value=e.teamMax||1;$('evNotes').value=e.notes||'';$('eventFormTitle').textContent='編輯｜'+e.name}
async function saveEvent(){busy(true,'正在儲存競賽…');try{await call('apiSaveEvent',{eventId:$('evId').value,name:$('evName').value,status:$('evStatus').value,eventType:$('evType').value,venue:$('evVenue').value,eventDate:$('evDate').value,registrationCloseAt:$('evClose').value,teamMin:$('evMin').value,teamMax:$('evMax').value,notes:$('evNotes').value});msg('evMsg','競賽已儲存','ok');await reload()}catch(e){msg('evMsg',e.message,'err')}finally{busy(false)}}
function renderRegs(){if(!S.m)return;const q=$('regSearch').value.toLowerCase(),ev=$('regEventFilter').value,st=$('regStatusFilter').value,a=S.m.registrations.filter(r=>(!ev||r.eventId===ev)&&(!st||r.status===st)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));$('regTable').innerHTML=a.length?'<div class="table"><table><tr><th>競賽</th><th>參賽者／班級</th><th>狀態</th><th>時間</th><th>審核</th></tr>'+a.map(r=>'<tr><td>'+esc(ename(r.eventId))+'<br><small>'+esc(r.registrationId)+'</small></td><td><b>'+esc(rlabel(r))+'</b><br>'+esc(r.className||'')+'<br><small>'+esc(r.registrantEmail||'')+'</small></td><td><span class="pill '+(r.status==='APPROVED'||r.status==='CHECKED_IN'?'ok':r.status==='REJECTED'?'bad':'')+'">'+esc(r.status)+'</span></td><td>'+fmt(r.createdAt)+'</td><td><div class="actions"><button class="btn good" onclick="setStatus(\''+esc(r.registrationId)+'\',\'APPROVED\')">核准</button><button class="btn bad" onclick="setStatus(\''+esc(r.registrationId)+'\',\'REJECTED\')">退回</button><button class="btn secondary" onclick="setStatus(\''+esc(r.registrationId)+'\',\'REGISTERED\')">重設</button></div></td></tr>').join('')+'</table></div>':'<div class="empty">沒有符合資料</div>'}async function setStatus(id,status){busy(true);try{await call('apiUpdateRegistrationStatus',{registrationId:id,status});await reload();show('registrations')}catch(e){alert(e.message)}finally{busy(false)}}
function renderChecks(){$('checkList').innerHTML=S.m.checkIns.length?'<div class="table"><table><tr><th>競賽</th><th>報名編號</th><th>時間</th><th>方式</th></tr>'+S.m.checkIns.slice().reverse().map(c=>'<tr><td>'+esc(ename(c.eventId))+'</td><td>'+esc(c.registrationId)+'</td><td>'+fmt(c.checkedInAt)+'</td><td>'+esc(c.method)+'</td></tr>').join('')+'</table></div>':'<div class="empty">尚無檢錄</div>'}async function checkIn(method){const id=$('checkId').value.trim();if(!id)return msg('checkMsg','請輸入報名編號','err');busy(true);try{await call('apiCheckIn',{registrationId:id,method,requestId:'admin-'+Date.now()});msg('checkMsg','檢錄成功：'+id,'ok');$('checkId').value='';await reload();show('checkin')}catch(e){msg('checkMsg',e.message,'err')}finally{busy(false)}}async function startScanner(){if(!('BarcodeDetector'in window))return msg('checkMsg','此瀏覽器不支援即時掃描，請手動輸入','err');try{const v=$('scanner'),stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.classList.remove('hidden');v.srcObject=stream;await v.play();const d=new BarcodeDetector({formats:['qr_code']});const scan=async()=>{const a=await d.detect(v).catch(()=>[]);if(a[0]){$('checkId').value=a[0].rawValue;stream.getTracks().forEach(t=>t.stop());v.classList.add('hidden');checkIn('QR')}else requestAnimationFrame(scan)};scan()}catch(e){msg('checkMsg',e.message,'err')}}
async function generateDraw(){if(!$('drawEvent').value)return msg('drawMsg','請選擇競賽','err');if(!confirm('抽籤完成後不可重複產生，確定繼續？'))return;busy(true);try{const a=await call('apiGenerateDraw',{eventId:$('drawEvent').value,groupSize:$('groupSize').value});msg('drawMsg','已產生 '+a.length+' 筆抽籤結果','ok');await reload();show('draw')}catch(e){msg('drawMsg',e.message,'err')}finally{busy(false)}}function fillMatchRegs(){if(!S.m)return;const id=$('matchEvent').value,opt='<option value="">請選擇</option>'+S.m.registrations.filter(r=>r.eventId===id&&!['CANCELLED','REJECTED'].includes(r.status)).map(r=>'<option value="'+esc(r.registrationId)+'">'+esc(rlabel(r))+'</option>').join('');$('sideA').innerHTML=opt;$('sideB').innerHTML=opt}async function saveMatch(){busy(true);try{await call('apiSaveMatch',{eventId:$('matchEvent').value,roundName:$('roundName').value,matchNo:$('matchNo').value,scheduledAt:$('matchAt').value,venue:$('matchVenue').value,sideARegistrationId:$('sideA').value,sideBRegistrationId:$('sideB').value});msg('matchMsg','賽程已儲存','ok');await reload();show('draw')}catch(e){msg('matchMsg',e.message,'err')}finally{busy(false)}}function renderDraws(){if(!S.m)return;const by=Object.fromEntries(S.m.registrations.map(r=>[r.registrationId,r]));$('drawData').innerHTML='<h3>抽籤結果</h3>'+(S.m.draws.length?'<div class="table"><table><tr><th>競賽</th><th>組</th><th>道次</th><th>參賽者</th></tr>'+S.m.draws.map(d=>'<tr><td>'+esc(ename(d.eventId))+'</td><td>'+esc(d.groupNo)+'</td><td>'+esc(d.laneNo)+'</td><td>'+esc(rlabel(by[d.registrationId]||{}))+'</td></tr>').join('')+'</table></div>':'<div class="empty">尚無抽籤資料</div>')+'<h3 style="margin-top:18px">賽程</h3>'+(S.m.matches.length?'<div class="table"><table><tr><th>競賽</th><th>輪次</th><th>時間</th><th>對戰</th></tr>'+S.m.matches.map(m=>'<tr><td>'+esc(ename(m.eventId))+'</td><td>'+esc(m.roundName)+' '+esc(m.matchNo)+'</td><td>'+fmt(m.scheduledAt)+'</td><td>'+esc(rlabel(by[m.sideARegistrationId]||{}))+' vs '+esc(rlabel(by[m.sideBRegistrationId]||{}))+'</td></tr>').join('')+'</table></div>':'<div class="empty">尚無賽程</div>')}
function fillResultRegs(){if(!S.m)return;const id=$('resultEvent').value;$('resultReg').innerHTML='<option value="">請選擇</option>'+S.m.registrations.filter(r=>r.eventId===id&&!['CANCELLED','REJECTED'].includes(r.status)).map(r=>'<option value="'+esc(r.registrationId)+'">'+esc(rlabel(r))+'</option>').join('')}async function saveResult(){busy(true);try{await call('apiSaveResult',{eventId:$('resultEvent').value,registrationId:$('resultReg').value,rank:$('rank').value,score:$('score').value,unit:$('unit').value,resultStatus:$('resultStatus').value});msg('resultMsg','成績已儲存','ok');await reload();show('results')}catch(e){msg('resultMsg',e.message,'err')}finally{busy(false)}}function renderResults(){if(!S.m)return;const by=Object.fromEntries(S.m.registrations.map(r=>[r.registrationId,r]));$('resultList').innerHTML=S.m.results.length?'<div class="table"><table><tr><th>競賽</th><th>名次</th><th>參賽者</th><th>成績</th></tr>'+S.m.results.map(r=>'<tr><td>'+esc(ename(r.eventId))+'</td><td>'+esc(r.rank)+'</td><td>'+esc(rlabel(by[r.registrationId]||{}))+'</td><td>'+esc(r.score)+' '+esc(r.unit)+'</td></tr>').join('')+'</table></div>':'<div class="empty">尚無成績</div>'}
async function saveSettings(){busy(true);try{await call('apiSaveSettings',{schoolName:$('schoolName').value,themeColor:$('themeColor').value});msg('settingsMsg','系統設定已儲存','ok');await reload()}catch(e){msg('settingsMsg',e.message,'err')}finally{busy(false)}}async function saveRole(){busy(true);try{await call('apiSaveRole',{email:$('roleEmail').value,role:$('roleName').value,scopeType:$('scopeId').value==='*'?'SYSTEM':'EVENT',scopeId:$('scopeId').value||'*'});msg('roleMsg','權限已儲存','ok');await reload();show('settings')}catch(e){msg('roleMsg',e.message,'err')}finally{busy(false)}}function renderRoles(){$('roleList').innerHTML=S.m.roles.length?'<div class="table"><table><tr><th>帳號</th><th>角色</th><th>範圍</th><th>狀態</th></tr>'+S.m.roles.map(r=>'<tr><td>'+esc(r.email)+'</td><td>'+esc(r.role)+'</td><td>'+esc(r.scopeType)+' / '+esc(r.scopeId)+'</td><td>'+esc(r.status)+'</td></tr>').join('')+'</table></div>':'<div class="empty">只有系統主管</div>'}function renderAudit(){$('auditList').innerHTML=S.m.auditLogs.length?'<div class="table"><table class="audit"><tr><th>時間</th><th>操作</th><th>帳號</th><th>紀錄</th></tr>'+S.m.auditLogs.map(a=>'<tr><td>'+fmt(a.at)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.actorEmail)+'</td><td>'+esc(a.recordId)+'</td></tr>').join('')+'</table></div>':'<div class="empty">尚無紀錄</div>'}
function printDoc(type){const by=Object.fromEntries(S.m.registrations.map(r=>[r.registrationId,r])),names={checkin:'競賽檢錄表',draw:'抽籤分組表',schedule:'競賽賽程表',bib:'號碼布清單'};let rows='';if(type==='checkin'||type==='bib')rows='<table><tr><th>競賽</th><th>班級</th><th>參賽者／隊伍</th><th>報名編號</th><th>'+(type==='checkin'?'簽到':'號碼')+'</th></tr>'+S.m.registrations.filter(r=>!['CANCELLED','REJECTED'].includes(r.status)).map(r=>'<tr><td>'+esc(ename(r.eventId))+'</td><td>'+esc(r.className)+'</td><td>'+esc(rlabel(r))+'</td><td>'+esc(r.registrationId)+'</td><td></td></tr>').join('')+'</table>';if(type==='draw')rows='<table><tr><th>競賽</th><th>組別</th><th>道次</th><th>參賽者</th></tr>'+S.m.draws.map(d=>'<tr><td>'+esc(ename(d.eventId))+'</td><td>'+esc(d.groupNo)+'</td><td>'+esc(d.laneNo)+'</td><td>'+esc(rlabel(by[d.registrationId]||{}))+'</td></tr>').join('')+'</table>';if(type==='schedule')rows='<table><tr><th>競賽</th><th>輪次</th><th>時間</th><th>場地</th><th>對戰</th></tr>'+S.m.matches.map(m=>'<tr><td>'+esc(ename(m.eventId))+'</td><td>'+esc(m.roundName)+' '+esc(m.matchNo)+'</td><td>'+fmt(m.scheduledAt)+'</td><td>'+esc(m.venue)+'</td><td>'+esc(rlabel(by[m.sideARegistrationId]||{}))+' vs '+esc(rlabel(by[m.sideBRegistrationId]||{}))+'</td></tr>').join('')+'</table>';$('printArea').innerHTML='<div class="card"><h1>'+names[type]+'</h1><p>'+esc(S.m.settings.schoolName||'宜蘭高中')+'｜列印時間 '+new Date().toLocaleString('zh-TW')+'</p>'+rows+'</div>';window.print()}
reload();
</script></body></html>
